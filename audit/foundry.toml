[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
solc_version = "0.8.24"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
bytecode_hash = "none"
cbor_metadata = false

fuzz = { runs = 256 }
invariant = { runs = 128, depth = 32, fail_on_revert = false }

[profile.ci]
fuzz = { runs = 10_000 }
invariant = { runs = 1_000, depth = 128, fail_on_revert = false }

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = true
int_types = "long"
quote_style = "double"
number_underscore = "thousands"
